# Prism idle: dim at 14 min, lock at 15, screens off at 30.
# Run as: hypridle -c ~/.config/prism/lock/hypridle.conf

general {
    lock_cmd = $HOME/.local/bin/prism-lock                # also what `loginctl lock-session` runs
    before_sleep_cmd = loginctl lock-session              # lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on
    inhibit_sleep = 3                                     # wait for the lock screen before sleeping
    ignore_dbus_inhibit = false                           # videos and calls keep the screen awake
}

# Heads-up: dim the backlight a minute before locking
listener {
    timeout = 840
    on-timeout = brightnessctl -s set 15%
    on-resume = brightnessctl -r
}

listener {
    timeout = 900
    on-timeout = loginctl lock-session
}

listener {
    timeout = 1800
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on && brightnessctl -r
}
